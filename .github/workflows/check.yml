name: Check extension

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      # Generates .wxt/tsconfig.json, which tsconfig.json extends.
      - run: npx wxt prepare
      - run: npm test
